# Project: clara

# SDLC Studio Project Configuration
# Place this file at: sdlc-studio/.config.yaml
# Only specify values that differ from defaults (see reference-config.md)

# Artefact schema version. New projects start on 3 (ULID identity + structured
# authorship / evidence enforcement). An existing project stays on whatever it declares
# (or 2 when it declares nothing) - it is never auto-flipped; upgrade explicitly via
# `project upgrade`. See reference-config.md and reference-upgrade.md.
schema_version: 3

# Example overrides - uncomment and modify as needed:

# profile: lite      # collapse the pipeline to PRD -> story -> implement (default: full)

# coverage:
#   unit: 80          # Lower target for legacy code
#   integration: 75

# story_quality:
#   edge_cases:
#     api: 6          # Fewer edge cases for simple APIs
#   sizing:
#     max_points: 8   # Smaller stories preferred

# tdd:
#   edge_case_threshold: 3  # TDD for more stories

# Raised from the default 4 on 2026-08-29, deliberately, to let RUN-01M0Q8VF take the
# bounded exit. Four close attempts are recorded against that run: two from an earlier
# session, then two from the session that finished RETRO0003, which went 4 outstanding
# to 3. The cap counts attempts, not trend, so it fired on a loop that was converging.
# The two items still refusing - goal-seat-reviewed and batch-boundary-review - cannot be
# answered at any cap, because their windows closed months ago and the tool correctly
# refuses a waiver for either ("a waiver here is a receipt, not an answer"). The exit is
# therefore `--file-and-close`, not another repair round. Operator decision.
review:
  max_rounds: 6
