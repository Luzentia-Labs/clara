# Clara CI - the blocking gate set (TRD Section 9, TSD).
#
# D0038: every gate is enumerated in `ci-gates.json`, each mapped to its TRD Section 9 number. The ones with a runnable command execute
# here and block the merge; the rest name the open story that lands them, and
# `scripts/check-ci-gates.mjs` fails if a pending gate names no open story or if a wired gate is
# missing from this file. A gate that reports without blocking is not a gate, and the gate count is read from
# ci-gates.json rather than written into prose, because every hand-written count here drifted.
#
# No `continue-on-error` appears anywhere in this workflow, by design.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changesets and mutation scope need history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the floor the packages declare. D0033: three test tools shipped majors that
          # raised their own Node floor above this, and are pinned below latest for that reason.
          node-version: 20.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gate manifest is itself gated: a pending gate must name an open story.
      - name: Gate manifest is honest
        run: node scripts/check-ci-gates.mjs

      - run: pnpm build

      - name: Gate 1 - typecheck
        run: pnpm typecheck

      - name: Gates 12 + deterministic guards
        run: pnpm check

      - name: Gate 3 - unit, interaction and axe tests
        run: pnpm test

      - name: Gate 4 - coverage thresholds
        run: pnpm test:coverage

      # The orientation file's figures, measured HERE rather than only on a developer's machine.
      # A guard that lives solely in preflight is a guard the author can skip - and the numbers it
      # protects are the first thing every agent reads.
      - name: Orientation figures are current
        run: pnpm check:latest

      - name: Gate 8 - token contrast, both themes
        run: pnpm check:contrast

      - name: Gate 2 - component CSS tier and literal rules
        run: pnpm check:component-css
      - name: Gate 21 - density token contract
        run: pnpm check:density-tokens
      - name: Gate 5 - axe, zero serious or critical violations
        run: pnpm check:axe
      - name: Gate 6 - keyboard interaction suite
        run: pnpm check:keyboard
      - name: Gate 8 - public token reference
        run: pnpm check:public-tokens
      - name: Gate 14 - consumer verification (Vite + Next App Router)
        run: pnpm verify:consumers
      - name: Gate 16 - tarball install-safety
        run: pnpm check:pack
      - name: Gate 15 - server/client boundary classification
        run: pnpm check:client-boundary
      - name: Gate 11 - API surface report diff
        run: pnpm check:api

      - name: Gate 12 - publint and attw
        run: pnpm check:publint && pnpm check:attw

      - name: Gate 13 - size budgets
        run: pnpm size

      - name: Gate 10 - mutation score
        run: pnpm test:mutation

      - name: Dependency audit
        run: pnpm audit --audit-level=high --prod

      - name: Changeset present on any packages/ change
        run: pnpm changeset status --since=origin/main

      # Installed once, then every browser gate runs against it. Gate 9 and gate 20 get their own
      # steps rather than riding inside the suite so a failure names the gate that failed.
      - name: Install Chromium for the browser gates
        run: pnpm exec playwright install --with-deps chromium
      - name: Gate 9 - computed geometry, rendered (TSD 7)
        run: pnpm check:geometry
      - name: Gate 20 - scoped theming and density reach tier 3
        run: pnpm check:scoping
      - name: Browser suite
        run: pnpm test:e2e
